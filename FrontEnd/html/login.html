<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ingreso de Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="icon" href="../img/logo.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="d-flex flex-column vh-100">
  <nav class="navbar navbar-dark bg-primary">
    <div class="container justify-content-between">
      <span class="navbar-brand d-flex align-items-center gap-2">
        <img src="../img/logo.png" alt="Logo" height="36" class="rounded">
        Tienda de Música
      </span>

      <div class="d-flex align-items-center gap-2">
        <ul class="nav justify-content-center gap-3 pt-2 pb-2 fs-5">
          <li class="nav-item">
            <button class="nav-link text-bg-primary" id="goToIndexBtn">Salir</button>
          </li>
        </ul>
        <button class="btn btn-outline-light btn-sm" id="themeToggle" title="Cambiar tema">
          🌙
        </button>
      </div>
    </div>
  </nav>

  <div class="bg-primary-subtle flex-grow-1">
    <div class="container h-100 bg-body">
      <div class="d-flex align-items-center justify-content-center py-5">
        <div class="card shadow-sm border w-100" style="max-width: 500px;">
          <div class="card-body p-4">
            <h2 class="fs-4 fw-medium mb-4">Iniciar sesión</h2>
 
            <form id="loginForm">
              <div class="mb-3">
                <label class="form-label small fw-medium" for="username">Usuario:</label>
                <input type="text" class="form-control" id="username" placeholder="usuario" required>
              </div>
              <div class="mb-3">
                <label class="form-label small fw-medium" for="password">Contraseña:</label>
                <input type="password" class="form-control" id="password" placeholder="**********" required>
              </div>
              <button type="button" class="btn btn-primary w-50 mt-1" id="loginBtn">
                Entrar
              </button>
            </form>
 
            <hr class="my-3">
 
            <p class="text-muted small mb-2">Autocompletar</p>
            <div class="d-flex gap-2 mb-3">
              <button class="btn btn-outline-secondary btn-sm flex-fill" id="autoCompleteBtn">
                Autocompletar
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <nav class="navbar navbar-dark bg-primary">
    <div class="container">
      <span class="navbar-text text-white col text-center">Chaves Inc. UTN 2026</span>
    </div>
  </nav>

  <!-- Success / Error modal -->
  <div class="modal fade" id="alertModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header" id="alertModalHeader">
          <h5 class="modal-title" id="alertModalTitle"></h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="alertModalBody"></div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
        </div>
      </div>
    </div>
  </div>
      
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>

  <script type="module" src="../js/login.js"></script>
  <script type="module" src="../js/app.js"></script>
</body>
</html>
