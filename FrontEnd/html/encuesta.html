<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Encuesta | Tienda de Música</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="icon" href="../img/logo.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="d-flex flex-column vh-100">
  <nav class="navbar navbar-dark bg-primary">
    <div class="container justify-content-between">
      <span class="navbar-brand d-flex align-items-center gap-2">
        <img src="../img/logo.png" alt="Logo" height="36" class="rounded">
        Tienda de Música
      </span>

      <div class="d-flex align-items-center gap-2">
        <ul class="nav justify-content-center gap-3 pt-2 pb-2 fs-5">
          <li class="nav-item">
            <button class="nav-link text-bg-primary" id="goBackBtn">Atrás</button>
          </li>
          <li class="nav-item">
            <button class="nav-link text-bg-primary" id="goToIndexBtn">Salir</button>
          </li>
        </ul>
        <button class="btn btn-outline-light btn-sm" id="themeToggle" onclick="toggleTheme()" title="Cambiar tema">
          🌙
        </button>
      </div>
    </div>
  </nav>

  <div class="bg-primary-subtle flex-grow-1 overflow-auto">
    <div class="container bg-light h-100 py-4">

    </div>
  </div>
    

  <nav class="navbar navbar-dark bg-primary">
    <div class="container">
      <div class="col"></div>
      <span class="navbar-text text-white col text-center">Chaves Inc. UTN 2026</span>
      <div class="col d-flex justify-content-end">
        <button class="btn btn-outline-light btn-sm" id="adminLoginBtn">Admin</button>
      </div>
    </div>
  </nav>

  <!-- Success / Error modal -->
  <div class="modal fade" id="alertModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header" id="alertModalHeader">
          <h5 class="modal-title" id="alertModalTitle"></h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="alertModalBody"></div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
        </div>
      </div>
    </div>
  </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="../js/encuesta.js"></script>
</body>
</html>
