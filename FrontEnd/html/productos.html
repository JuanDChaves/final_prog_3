<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Productos | Tienda de Música</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="icon" href="../img/logo.png">
  <link rel="stylesheet" href="../style.css">
</head>
<body class="d-flex flex-column vh-100">
  <nav class="navbar navbar-dark bg-primary">
    <div class="container justify-content-between">
      <span class="navbar-brand d-flex align-items-center gap-2">
        <img src="../img/logo.png" alt="Logo" height="36" class="rounded">
        Tienda de Música
      </span>

      <div class="d-flex align-items-center gap-2">
        <ul class="nav justify-content-center gap-3 pt-2 pb-2 fs-5">
          <li class="nav-item">
            <button class="nav-link text-bg-primary" id="goToCartBtn">Carrito</button>
          </li>
        </ul>
        <ul class="nav justify-content-center gap-3 pt-2 pb-2 fs-5">
          <li class="nav-item">
            <button class="nav-link text-bg-primary" id="goToIndexBtn">Salir</button>
          </li>
        </ul>
        <button class="btn btn-outline-light btn-sm" id="themeToggle" title="Cambiar tema">
          🌙
        </button>
      </div>
    </div>
  </nav>

  <div class="bg-primary-subtle flex-grow-1 overflow-auto">
    <div class="container bg-body h-100 py-4">
      <button type="button" id="goToProductBtn">Detalle</button>
 <!-- Filter tabs -->
    <div class="d-flex gap-2 mb-4">
      <button class="btn btn-primary btn-sm px-4" id="filterAll" onclick="filterProducts('all', this)">Todos</button>
      <button class="btn btn-outline-primary btn-sm px-4" id="filterInstruments" onclick="filterProducts('instrumento', this)">Instrumentos</button>
      <button class="btn btn-outline-primary btn-sm px-4" id="filterBooks" onclick="filterProducts('libro', this)">Libros</button>
    </div>

    <!-- Product grid -->
    <div id="productGrid" class="row g-3"></div>

    <!-- Pagination -->
    <nav class="mt-4 d-flex justify-content-center" id="paginationNav">
      <ul class="pagination" id="pagination"></ul>
    </nav>
    </div>
  </div>
    

  <nav class="navbar navbar-dark bg-primary">
    <div class="container">
      <div class="col"></div>
      <span class="navbar-text text-white col text-center">Chaves Inc. UTN 2026</span>
      <div class="col d-flex justify-content-end">
        <button class="btn btn-outline-light btn-sm" id="adminLoginBtn">Admin</button>
      </div>
    </div>
  </nav>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script type="module" src="../js/productos.js"></script>
</body>
</html>
