<!DOCTYPE html>
<html lang="en" data-bs-theme="light"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alta | Tienda de Música</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="icon" href="../img/logo.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="d-flex flex-column vh-100">
  <nav class="navbar navbar-dark bg-primary">
    <div class="container justify-content-between">
       <span class="navbar-brand d-flex align-items-center gap-2">
        <img src="../img/logo.png" alt="Logo" height="36" class="rounded">
        Tienda de Música
      </span>

      <div class="d-flex align-items-center gap-2">
        <ul class="nav justify-content-center gap-3 pt-2 pb-2 fs-5">
           <li class="nav-item">
            <button class="nav-link text-bg-primary" id="goBackBtn">Atrás</button>
          </li>
          <li class="nav-item">
            <button class="nav-link text-bg-primary" id="goToIndexBtn">Salir</button>
          </li>
        </ul>
        <button class="btn btn-outline-light btn-sm" id="themeToggle" title="Cambiar tema">
          🌙
        </button>
      </div>
    </div>
  </nav>

  <div class="bg-primary-subtle flex-grow-1 overflow-auto">
    <div class="container bg-body h-100 py-4">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="fw-semibold mb-0">Alta\Edición de Producto</h4>
      </div>

      <div class="card shadow-sm border mx-auto" style="max-width: 700px;">
        <div class="card-body p-4">

          <div class="row g-3">

            <!-- Name -->
            <div class="col-12 col-md-6">
              <label class="form-label small fw-medium" for="name">Nombre</label>
              <input type="text" class="form-control" id="name" placeholder="Ej: Guitarra Eléctrica">
              <div class="invalid-feedback" id="nameError"></div>
            </div>

            <!-- Type -->
            <div class="col-12 col-md-6">
              <label class="form-label small fw-medium" for="type">Tipo</label>
              <select class="form-select" id="type">
                <option value="" disabled selected>Seleccionar tipo</option>
                <option value="instrumento">Instrumento</option>
                <option value="libro">Libro</option>
              </select>
              <div class="invalid-feedback" id="typeError"></div>
            </div>

            <!-- Price -->
            <div class="col-12 col-md-6">
              <label class="form-label small fw-medium" for="price">Precio</label>
              <div class="input-group">
                <span class="input-group-text">$</span>
                <input type="number" class="form-control" id="price" placeholder="0.00" min="0" step="0.01">
              </div>
              <div class="invalid-feedback" id="priceError"></div>
            </div>

            <!-- Active -->
            <div class="col-12 col-md-6 d-flex align-items-end pb-1">
              <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" id="active" checked>
                <label class="form-check-label fw-medium" for="active">Activo</label>
              </div>
            </div>

            <!-- Description -->
            <div class="col-12">
              <label class="form-label small fw-medium" for="description">Descripción</label>
              <textarea class="form-control" id="description" rows="3" placeholder="Descripción del producto..."></textarea>
            </div>

            <!-- Dimensions -->
            <div class="col-12 col-md-4">
              <label class="form-label small fw-medium" for="height">Alto (cm)</label>
              <input type="number" class="form-control" id="height" placeholder="0" min="0" step="0.1">
            </div>

            <div class="col-12 col-md-4">
              <label class="form-label small fw-medium" for="width">Ancho (cm)</label>
              <input type="number" class="form-control" id="width" placeholder="0" min="0" step="0.1">
            </div>

            <div class="col-12 col-md-4">
              <label class="form-label small fw-medium" for="weight">Peso (kg)</label>
              <input type="number" class="form-control" id="weight" placeholder="0.0" min="0" step="0.01">
            </div>

            <!-- Image -->
            <div class="col-12">
              <label class="form-label small fw-medium" for="imageInput">Imagen</label>
              <input type="file" class="form-control" id="imageInput" accept="image/*">
              <div class="invalid-feedback" id="imageError"></div>
            </div>

            <!-- Image preview -->
            <div class="col-12" id="previewContainer" style="display:none;">
              <img id="imagePreview" src="" alt="Preview" class="rounded border" style="max-height: 100px; object-fit: cover;">
            </div>

          </div>

          <hr class="my-4">

          <div class="d-flex justify-content-end gap-2">
            <button class="btn btn-outline-secondary" id="cancelBtn">Cancelar</button>
            <button class="btn btn-primary" id="submitBtn">Guardar producto</button>
          </div>

        </div>
      </div>
      
    </div>
  </div>

  <nav class="navbar navbar-dark bg-primary">
    <div class="container">
      <span class="navbar-text text-white col text-center">Chaves Inc. UTN 2026</span>
    </div>
  </nav>

  <!-- Confirm modal -->
    <div class="modal fade" id="confirmModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
        <div class="modal-header">
            <h5 class="modal-title" id="confirmModalTitle"></h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="confirmModalBody"></div>
        <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button type="button" class="btn" id="confirmModalBtn">Confirmar</button>
        </div>
        </div>
    </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script type="module" src="../js/alta.js"></script>
</body>
</html>
