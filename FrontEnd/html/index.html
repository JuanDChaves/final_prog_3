<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tienda de Música</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="icon" href="../img/logo.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="d-flex flex-column vh-100">
  <nav class="navbar navbar-dark bg-primary">
    <div class="container justify-content-between">
      <span class="navbar-brand d-flex align-items-center gap-2">
        <img src="../img/logo.png" alt="Logo" height="36" class="rounded">
        Tienda de Música
      </span>

      <div class="d-flex align-items-center gap-2">
        <button class="btn btn-outline-light btn-sm" id="themeToggle" onclick="toggleTheme()" title="Cambiar tema">
          🌙
        </button>
      </div>
    </div>
  </nav>

  <div class="bg-primary-subtle flex-grow-1 overflow-auto">
    <div class="container bg-light h-100 py-4">
      <form action="">
        <label for="username">Tu nombre: </label>
        <input type="text" id="username" required>
        <button type="submit" id="ingresarBtn">Ingresar</button>
      </form>


    </div>
  </div>

   <nav class="navbar navbar-dark bg-primary">
    <div class="container">
      <div class="col"></div>
      <span class="navbar-text text-white col text-center">Chaves Inc. UTN 2026</span>
      <div class="col d-flex justify-content-end">
        <button class="btn btn-outline-light btn-sm" id="adminLoginBtn">Admin</button>
      </div>
    </div>
  </nav>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
    <script src="../js/index.js"></script>
</body>
</html>
