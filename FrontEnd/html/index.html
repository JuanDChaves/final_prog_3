<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tienda de Música</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="icon" href="../img/logo.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="d-flex flex-column vh-100">
  <nav class="navbar navbar-dark bg-primary">
    <div class="container justify-content-between">
      <span class="navbar-brand d-flex align-items-center gap-2">
        <img src="../img/logo.png" alt="Logo" height="36" class="rounded">
        Tienda de Música
      </span>

      <div class="d-flex align-items-center gap-2">
        <button class="btn btn-outline-light btn-sm" id="themeToggle" title="Cambiar tema">
          🌙
        </button>
      </div>
    </div>
  </nav>

  <div class="bg-primary-subtle flex-grow-1 overflow-auto">
  <div class="container bg-body h-100 py-4 py-md-5">

    <div class="text-center mb-5">
      <h1 class="display-5 fw-bold">🎵 Bienvenido a la Tienda de Música</h1>
      <p class="text-muted fs-5">Explorá nuestra colección de instrumentos y libros</p>
    </div>

    <div class="d-flex justify-content-center">
      <div class="card shadow-sm border w-100" style="max-width: 420px;">
        <div class="card-body p-4">
          <h5 class="fw-medium mb-1">¿Cómo te llamás?</h5>
          <p class="text-muted small mb-3">Ingresá tu nombre para continuar</p>
          <form id="indexForm">
            <div class="mb-3">
              <label class="form-label small fw-medium" for="username">Tu nombre:</label>
              <input type="text" class="form-control" id="username" placeholder="Ej: Juan" required>
            </div>
            <button type="submit" class="btn btn-primary w-100" id="ingresarBtn">
              Ingresar →
            </button>
          </form>
        </div>
      </div>
    </div>

  </div>
</div>

   <nav class="navbar navbar-dark bg-primary">
    <div class="container">
      <div class="col"></div>
      <span class="navbar-text text-white col text-center">Chaves Inc. UTN 2026</span>
      <div class="col d-flex justify-content-end">
        <button class="btn btn-outline-light btn-sm" id="adminLoginBtn">Admin</button>
      </div>
    </div>
  </nav>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
    <script src="../js/index.js"></script>
</body>
</html>
