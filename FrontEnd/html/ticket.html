<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ticket | Tienda de Música</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="icon" href="../img/logo.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="d-flex flex-column vh-100">
  <nav class="navbar navbar-dark bg-primary">
    <div class="container justify-content-between">
      <span class="navbar-brand d-flex align-items-center gap-2">
        <img src="../img/logo.png" alt="Logo" height="36" class="rounded">
        Tienda de Música
      </span>

      <div class="d-flex align-items-center gap-2">
        <ul class="nav justify-content-center gap-3 pt-2 pb-2 fs-5">
          <li class="nav-item">
            <button class="nav-link text-bg-primary" id="goBackBtn">Atrás</button>
          </li>
          <li class="nav-item">
            <button class="nav-link text-bg-primary" id="goToIndexBtn">Salir</button>
          </li>
        </ul>
        <button class="btn btn-outline-light btn-sm" id="themeToggle" title="Cambiar tema">
          🌙
        </button>
      </div>
    </div>
  </nav>

  <div class="bg-primary-subtle flex-grow-1 overflow-auto">
    <div class="container bg-body h-100 py-4">
        <!-- Action buttons (hidden when printing) -->
      <div class="d-flex justify-content-between align-items-center mb-4 no-print">
        <h4 class="fw-semibold mb-0">Tu comprobante de compra</h4>
        <button class="btn btn-primary" onclick="window.print()">Imprimir / Descargar PDF</button>
      </div>

      <div class="card shadow-sm border mx-auto" style="max-width: 600px;" id="ticketCard">
        <div class="card-body p-4">

          <div class="text-center mb-4">
            <img src="../img/logo.png" alt="Logo" height="48" class="rounded mb-2">
            <h5 class="fw-bold mb-0">Tienda de Música</h5>
            <p class="text-muted small mb-0">Chaves Inc. UTN 2026</p>
          </div>

          <hr>

          <div class="d-flex justify-content-between mb-3">
            <div>
              <p class="mb-0 small text-muted">Cliente</p>
              <p class="fw-semibold mb-0" id="ticketCustomer">—</p>
            </div>
            <div class="text-end">
              <p class="mb-0 small text-muted">Fecha</p>
              <p class="fw-semibold mb-0" id="ticketDate">—</p>
            </div>
          </div>

          <hr>

          <table class="table table-sm mb-0">
            <thead>
              <tr>
                <th>Producto</th>
                <th class="text-center">Cant.</th>
                <th class="text-end">Precio</th>
                <th class="text-end">Subtotal</th>
              </tr>
            </thead>
            <tbody id="ticketItems"></tbody>
            <tfoot>
              <tr class="fw-bold">
                <td colspan="3" class="text-end">Total:</td>
                <td class="text-end text-primary" id="ticketTotal">$0.00</td>
              </tr>
            </tfoot>
          </table>

          <hr>

          <p class="text-center text-muted small mb-0">¡Gracias por tu compra!</p>

        </div>
      </div>

      <div class="d-flex justify-content-center mt-3 no-print">
        <button type="button" class="btn btn-outline-primary" id="surveyBtn">Ir a la encuesta →</button>
      </div>
    </div>
  </div>
    

  <nav class="navbar navbar-dark bg-primary">
    <div class="container">
      <div class="col"></div>
      <span class="navbar-text text-white col text-center">Chaves Inc. UTN 2026</span>
      <div class="col d-flex justify-content-end">
        <button class="btn btn-outline-light btn-sm" id="adminLoginBtn">Admin</button>
      </div>
    </div>
  </nav>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script type="module" src="../js/ticket.js"></script>
</body>
</html>
